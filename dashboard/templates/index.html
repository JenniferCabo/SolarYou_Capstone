<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team 11 - Stabilization Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Header: static, no live data -->
    <header>
        <h1>Active Stabilization &amp; Solar Tracking Platform</h1>
        <p class="subtitle">Live Dashboard <span class="mock-badge">MOCK DATA</span></p>
    </header>

    <!-- Chart + readout are updated live by dashboard.js on each
         "sensor_update" event pushed from app.py -->
    <main>
        <section class="chart-card">
            <h2>Pitch &amp; Roll (degrees)</h2>
            <canvas id="orientationChart"></canvas>
        </section>

        <section class="stats-card">
            <h2>Current Readings</h2>
            <dl>
                <dt>Pitch</dt><dd id="pitchValue">--</dd>
                <dt>Roll</dt><dd id="rollValue">--</dd>
                <dt>Power</dt><dd id="powerValue">--</dd>
            </dl>
        </section>
    </main>

    <!-- Socket.IO client + Chart.js, loaded from CDN -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
